name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build service
        run: npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Ansible
        run: python -m pip install --disable-pip-version-check ansible-core==2.17.*

      - name: Configure SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy with Ansible
        env:
          ANSIBLE_CONFIG: ansible/ansible.cfg
          ANSIBLE_HOST_KEY_CHECKING: "False"
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ansible-playbook ansible/node_service.yml \
            --tags app \
            --inventory "${SERVER_HOST}," \
            --private-key ~/.ssh/deploy_key \
            --extra-vars "ansible_user=${SSH_USER}"

      - name: Verify public endpoint
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: curl --fail --retry 5 --retry-delay 2 "http://${SERVER_HOST}/health"
